services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Yze: Data Source=/data/yze.db
    ports:
      - "8080:8080"
    volumes:
      - yze-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yze-data:
